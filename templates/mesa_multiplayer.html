<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mesa de Cassino | Sala {{ codigo }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <div class="mesa-cassino" style="max-width: 1000px;">
        <header>
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                <a href="{{ url_for('multiplayer_lobby') }}" style="color: #a3c2b8; text-decoration: none; font-size: 0.9rem;">← Sair da Mesa</a>
                <h1>♣ Mesa: <span id="codigo-sala" style="color: #f7d070; letter-spacing: 3px;">{{ codigo }}</span> ♠</h1>
                <span id="contador-jogadores" style="color: #f7d070; font-weight: bold; background: rgba(0,0,0,0.4); padding: 5px 12px; border-radius: 15px; border: 1px solid #f7d070;">1/5 Jogadores</span>
            </div>
            <p class="subtitulo">Até 5 amigos juntos contra a Banca (Dealer) | Convide pelo código <strong>{{ codigo }}</strong></p>
        </header>

        <!-- DEALER (A BANCA) -->
        <section class="area-jogo" style="background: rgba(0,0,0,0.35); max-width: 500px; margin: 0 auto 20px;">
            <h2>Dealer (Banca)</h2>
            <div class="cartas" id="cartas-dealer"></div>
            <p class="pontuacao">Pontos do Dealer: <strong id="pontos-dealer">0</strong></p>
        </section>

        <!-- STATUS GERAL DA MESA -->
        <div id="indicador-status" style="background: #0d1e1c; border: 1px solid #f7d070; border-radius: 20px; padding: 10px 25px; display: inline-block; margin-bottom: 20px; font-weight: bold; color: #f7d070; font-size: 1.1rem;">
            Carregando mesa...
        </div>

        <!-- OS ASSENTOS DOS JOGADORES (ATÉ 5) -->
        <div id="grade-jogadores" style="display: flex; justify-content: center; gap: 15px; flex-wrap: wrap; margin-bottom: 25px;">
            <!-- O JavaScript vai desenhar cada jogador sentado aqui -->
        </div>

                <!-- CONTROLES DA FASE DE APOSTA (FICHAS E CONFIRMAÇÃO) -->
        <div id="painel-apostas" style="display: none; background: rgba(0,0,0,0.4); padding: 20px; border-radius: 20px; border: 1px dashed #f7d070;">
            <h3 style="color: #f7d070; margin-bottom: 12px;">Escolha sua aposta e confirme:</h3>
            <div style="display: flex; justify-content: center; gap: 12px; margin-bottom: 15px; flex-wrap: wrap;">
                <button onclick="mudarAposta(10)" class="ficha ficha-azul">$10</button>
                <button onclick="mudarAposta(25)" class="ficha ficha-verde">$25</button>
                <button onclick="mudarAposta(50)" class="ficha ficha-vermelha">$50</button>
                <button onclick="mudarAposta(100)" class="ficha ficha-preta">$100</button>
                <button onclick="mudarAposta(500)" class="ficha ficha-dourada">$500</button>
            </div>
            
            <div style="margin-top: 15px;">
                <!-- Botão de confirmação para TODOS os jogadores (convidados e dono) -->
                <button id="btn-confirmar-aposta" onclick="confirmarAposta()" class="botao" style="background: #2e7d32; font-size: 1rem; padding: 10px 25px; margin-right: 15px;">Confirmar Aposta ✅</button>
                
                <!-- Botão que o dono clica para dar as cartas (só ativa quando todos confirmarem) -->
                <button id="btn-iniciar-rodada" onclick="iniciarRodada()" class="botao botao-comprar" style="display: none; font-size: 1.1rem; padding: 12px 30px;">Dar as Cartas! 🃏</button>
                <span id="msg-aguardando-dono" style="color: #a3c2b8; font-size: 0.9rem; display: block; margin-top: 10px;">Aguardando todos os jogadores confirmarem...</span>
            </div>
        </div>

        <!-- CONTROLES DE JOGADA (COMPRAR / PARAR) -->
        <div id="painel-jogada" style="display: none; margin-top: 15px;">
            <button id="btn-comprar" onclick="jogarMulti('comprar')" class="botao botao-comprar" style="margin-right: 15px;">Comprar Carta ➕</button>
            <button id="btn-parar" onclick="jogarMulti('parar')" class="botao botao-parar">Parar ✋</button>
        </div>

        <!-- BOTÃO PARA PRÓXIMA RODADA (QUANDO FINALIZAR) -->
        <div id="painel-proxima-rodada" style="display: none; margin-top: 20px;">
            <button onclick="proximaRodada()" class="botao botao-novo" style="font-size: 1.1rem; padding: 12px 35px;">Nova Rodada de Apostas 🪙</button>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/multiplayer.js') }}"></script>
</body>
</html>
